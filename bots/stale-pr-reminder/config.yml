# Stale PR review reminder configuration.
# GitHub login -> Matrix ID mappings for @mentions live in the MATRIX_USERS secret.

# A requested reviewer is "stale" after this many working days (Mon-Fri, UTC) since they were
# (re-)requested. Comments don't count; approving or requesting changes does.
# This default applies to PRs without a matching label rule (no tb-team / priority label).
# Their reviewers are NOT @mentioned.
stale_after_working_days: 10

# Same, for Dependabot and Renovate PRs. If a label rule also matches, the lower threshold wins.
dependency_stale_after_working_days: 3

skip_drafts: true

# Post a "nothing stale" message when there is nothing to report.
post_when_empty: false

labels:
  # PRs with any of these labels are never reported (case-insensitive).
  # Note: "report: exclude" is about release notes, not reviews, so it isn't listed here.
  exclude:
    - "status: blocked"

  # PRs with these labels are listed under "Maintainers". All other PRs are grouped by author:
  # Dependencies (Dependabot, Renovate), Collaborators (org members, repo collaborators), Community.
  maintainer:
    - tb-team

  # Label rules set urgency in every section: PRs matching any rule go stale sooner and their
  # reviewers are @mentioned. When several match, the lowest threshold, the lowest priority and
  # the marker of the highest-priority rule win. A lower priority is listed first.
  rules:
    - label: "priority: urgent"
      stale_after_working_days: 0   # immediately
      priority: 0
      marker: "🔴"
    - label: "priority: high"
      stale_after_working_days: 1
      priority: 1
      marker: "🟠"
    - label: tb-team
      stale_after_working_days: 2
      priority: 2
    - label: "priority: medium"
      stale_after_working_days: 3
      priority: 3
      marker: "🟡"
    - label: "priority: low"
      stale_after_working_days: 5
      priority: 200
      marker: "🔵"

# Each repo belongs to exactly one team; its PRs are reported under that team.
# Only PRs in the repos listed here are checked.
#
# room_env names the environment variable (a secret in the workflow) holding the team's room ID;
# the default is MATRIX_ROOM_ID. Teams sharing a room get one combined message, teams with their
# own room get their own message.
teams:
  - name: Android
    emoji: "🤖"
    repos:
      - thunderbird/thunderbird-android
      - thunderbird/thunderbird-android-l10n
  - name: iOS
    emoji: "🍎"
    repos:
      - thunderbird/thunderbird-ios
  - name: Shared
    emoji: "🧩"
    repos:
      - thunderbird/thunderbird-mobile-components
      - thunderbird/thunderbird-mobile-components-l10n
      - thunderbird/thunderbird-mobile-weblate
